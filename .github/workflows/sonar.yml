name: SAST - SonarCloud (BT) Caller
on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request_target:
  workflow_dispatch:

jobs:
   SAST_caller:
      # Skip on forks — the eudi-infra-ci reusable workflow needs SONAR_TOKEN
      # / DOJO_* secrets that only the upstream repo has.
      if: github.repository == 'eu-digital-identity-wallet/eudi-app-android-wallet-ui'
      uses: eu-digital-identity-wallet/eudi-infra-ci/.github/workflows/sast_action_android_cov.yml@main
      secrets:
       SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
       GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       DOJO_TOKEN: ${{ secrets.DOJO_TOKEN }}
       DOJO_URL: ${{ secrets.DOJO_URL }}
