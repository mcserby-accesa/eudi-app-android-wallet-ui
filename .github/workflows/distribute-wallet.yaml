name: Distribute Wallet

# Builds the demo/release APK and uploads it to Firebase App Distribution.
# Mirrors the bank-app workflow in the companion repo
# (instant-payments-initiative/.github/workflows/distribute-bank-app.yaml).
#
# Triggered by:
#   - any push to accesa-de (the Accesa-work integration branch — `main`
#     in this repo is reserved for clean upstream sync, never distributed)
#   - manual workflow_dispatch (with optional release-notes override)
#
# The wallet has two flavors (`dev`, `demo`); only `demo` is wired to
# Firebase App Distribution — see app/build.gradle.kts. The runtime PID
# issuer URL is set per-workshop via the in-app QR-config screen, so the
# same APK works against any backend (sslip.io cluster, tailnet, etc).

on:
  push:
    branches: [accesa-de]
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes shown to testers"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  distribute:
    name: Build + distribute (demoRelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.WALLET_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_B64}" ]]; then
            echo "::error::WALLET_KEYSTORE_B64 is not set; can't sign release APKs."
            exit 1
          fi
          echo "${KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/wallet.jks"
          echo "KEYSTORE_FILE=${RUNNER_TEMP}/wallet.jks" >> "${GITHUB_ENV}"

      - name: Decode Firebase service account
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${SA_JSON}" ]]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set; can't upload to App Distribution."
            exit 1
          fi
          printf '%s' "${SA_JSON}" > "${RUNNER_TEMP}/firebase-service-account.json"
          echo "FIREBASE_SA_FILE=${RUNNER_TEMP}/firebase-service-account.json" >> "${GITHUB_ENV}"

      - name: Resolve release notes
        id: notes
        env:
          # Pass the (potentially multi-line) commit message + workflow
          # input through env vars rather than YAML template literals.
          # Substituting ${{ github.event.head_commit.message }} directly
          # into bash breaks shell quoting when the message has newlines.
          INPUT_NOTES: ${{ inputs.release_notes }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_NOTES}" ]]; then
            notes="${INPUT_NOTES}"
          else
            notes="${HEAD_MESSAGE} (${GITHUB_SHA::7})"
          fi
          # Single-line, ~1KB, stripped of chars that would break the
          # Gradle -PfirebaseReleaseNotes value passed downstream.
          notes="${notes//$'\n'/ }"
          notes="${notes//$'\r'/}"
          notes="${notes//\"/}"
          notes="${notes//\`/}"
          notes="${notes:0:1000}"
          echo "value=${notes}" >> "${GITHUB_OUTPUT}"

      - name: Build + upload
        env:
          KEYSTORE_PASSWORD: ${{ secrets.WALLET_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WALLET_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WALLET_KEY_PASSWORD }}
          # Forward the resolved release notes through an env var (not a
          # YAML template literal in the command) so commit messages
          # containing ${{...}}, backticks, or other shell metacharacters
          # don't break the bash script when inlined.
          RELEASE_NOTES: ${{ steps.notes.outputs.value }}
        run: |
          set -euo pipefail
          # Firebase App ID is committed as default in app/build.gradle.kts;
          # no secret to inject here. Override with -PfirebaseWalletAppId
          # if targeting a different Firebase project.
          ./gradlew \
            :app:assembleDemoRelease \
            :app:appDistributionUploadDemoRelease \
            --no-daemon \
            -PwalletKeystoreFile="${KEYSTORE_FILE}" \
            -PwalletKeystorePassword="${KEYSTORE_PASSWORD}" \
            -PwalletKeyAlias="${KEY_ALIAS}" \
            -PwalletKeyPassword="${KEY_PASSWORD}" \
            -PfirebaseServiceAccount="${FIREBASE_SA_FILE}" \
            -PfirebaseTesterGroups="workshop" \
            -PfirebaseReleaseNotes="${RELEASE_NOTES}"
